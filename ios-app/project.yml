name: OpenCodeNexus
configs:
  Debug: debug
  SimDebug: debug
  Release: release
packages:
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm
    from: 1.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.0.0
options:
  bundleIdPrefix: ai.v1truv1us
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SDKROOT: iphoneos
targets:
  OpenCodeNexus:
    type: application
    platform: iOS
    sources:
      - path: OpenCodeNexus
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.v1truv1us.opencode-mobile
        INFOPLIST_FILE: OpenCodeNexus/Info.plist

        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
      configs:
        Debug:
          DEVELOPMENT_TEAM: PCJU8QD9FN
          CODE_SIGN_IDENTITY: Apple Development
        SimDebug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
        Release:
          DEVELOPMENT_TEAM: PCJU8QD9FN
          CODE_SIGN_STYLE: Automatic
  OpenCodeNexusTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: OpenCodeNexus
    sources:
      - OpenCodeNexusTests
    dependencies:
      - target: OpenCodeNexus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentic-codeflow.opencode-nexus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenCodeNexus.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenCodeNexus
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          DEVELOPMENT_TEAM: PCJU8QD9FN
        SimDebug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
  OpenCodeNexusIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: OpenCodeNexus
    sources:
      - OpenCodeNexusIntegrationTests
    dependencies:
      - target: OpenCodeNexus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentic-codeflow.opencode-nexus.integration-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenCodeNexus.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenCodeNexus
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          DEVELOPMENT_TEAM: PCJU8QD9FN
        SimDebug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
  OpenCodeNexusE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OpenCodeNexusE2ETests
    dependencies:
      - target: OpenCodeNexus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentic-codeflow.opencode-nexus.e2e-tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          DEVELOPMENT_TEAM: PCJU8QD9FN
        SimDebug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
schemes:
  OpenCodeNexus:
    build:
      targets:
        OpenCodeNexus: all
    test:
      gatherCoverageData: true
      targets:
        - OpenCodeNexusTests
      config: SimDebug
  OpenCodeNexus-Device:
    build:
      targets:
        OpenCodeNexus: all
      config: Debug
