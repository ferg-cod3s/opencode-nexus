name: OpenCodeNexus
options:
  bundleIdPrefix: com.agentic-codeflow
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  settings:
    base:
      SWIFT_VERSION: "6.2"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SDKROOT: iphoneos
targets:
  OpenCodeNexus:
    type: application
    platform: iOS
    sources:
      - OpenCodeNexus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentic-codeflow.opencode-nexus
        INFOPLIST_FILE: OpenCodeNexus/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
